  <style>
    :root{
      --bg:#08122B;
      --bg-2:#0F1E3C;
      --panel:#0D1A35;
      --ink:#EAF0FB;
      --muted:#93A9CC;
      --accent:#EF4444;
      --accent-soft:#F87171;
      --cta:#DC2626;
      --teal:#2FBFA3;
      --cyan:#5FE0EE;
      --blue:#8FA8FF;
      --line:rgba(228,233,241,.14);
      --max:1060px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      background:
        radial-gradient(circle at 50% 7%, rgba(33,72,140,.30), transparent 23rem),
        radial-gradient(circle at 15% 34%, rgba(239,68,68,.08), transparent 21rem),
        linear-gradient(180deg,var(--bg),var(--bg-2) 58%,var(--bg));
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:radial-gradient(rgba(255,255,255,.16) .7px,transparent .7px);
      background-size:24px 24px;
      opacity:.15;
      mask-image:radial-gradient(circle at 50% 10%,#000 0,transparent 66%);
      -webkit-mask-image:radial-gradient(circle at 50% 10%,#000 0,transparent 66%);
    }
    a{color:inherit}
    .skip-link{
      position:absolute;
      left:14px;
      top:-80px;
      padding:10px 14px;
      background:#fff;
      color:#08122B;
      border-radius:10px;
      z-index:100;
    }
    .skip-link:focus{top:12px}

    .site-header{
      width:min(var(--max),calc(100% - 36px));
      margin:0 auto;
      min-height:88px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      border-bottom:1px solid var(--line);
    }
    .brand{
      display:inline-flex;
      align-items:center;
      gap:12px;
      color:var(--ink);
      text-decoration:none;
      font-size:20px;
      font-weight:850;
      letter-spacing:-.025em;
    }
    .brand-mark{width:46px;height:46px;overflow:visible;flex:none}
    .brand-mark .tile{fill:var(--bg-2);stroke:rgba(255,255,255,.18);stroke-width:2}
    .brand-mark .glyph{fill:none;stroke:#fff;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
    .brand-mark .dot{fill:var(--accent)}
    .brand-ape{color:var(--accent)}
    .header-right{display:flex;align-items:center;gap:14px}
    .nav-link{
      color:#DDE7F7;
      text-decoration:none;
      font-size:14px;
      font-weight:700;
      padding:8px 2px;
      border-bottom:2px solid transparent;
    }
    .nav-link:hover,.nav-link[aria-current="page"]{border-bottom-color:var(--accent)}
    .build-state{
      border:1px solid rgba(95,224,238,.22);
      border-radius:999px;
      padding:7px 11px;
      color:#CFE2FF;
      background:rgba(255,255,255,.035);
      font-size:11px;
      font-weight:800;
      letter-spacing:.09em;
      white-space:nowrap;
    }

    main{width:min(var(--max),calc(100% - 36px));margin:0 auto}
    .hero{
      position:relative;
      min-height:560px;
      padding:86px 0 62px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      overflow:hidden;
    }
    .signal{
      position:absolute;
      border:1px solid rgba(95,224,238,.13);
      border-radius:50%;
      pointer-events:none;
    }
    .signal-one{width:560px;height:560px;top:115px;left:50%;transform:translateX(-50%)}
    .signal-two{width:760px;height:760px;top:14px;left:50%;transform:translateX(-50%);border-style:dashed;opacity:.55}
    .hero-copy{position:relative;z-index:3;max-width:820px}
    .eyebrow{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:0 0 15px;
      color:#D9E6F8;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.14em;
    }
    .eyebrow span{width:28px;height:2px;background:var(--accent);border-radius:2px;box-shadow:0 0 15px rgba(239,68,68,.75);flex:none}
    h1{
      margin:0;
      font-size:clamp(42px,6vw,72px);
      line-height:1.02;
      letter-spacing:-.045em;
    }
    h1 em{
      font-style:normal;
      background:linear-gradient(90deg,var(--blue),var(--cyan));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .lede{
      max-width:740px;
      margin:22px auto 0;
      color:#B7C6DD;
      font-size:18px;
      line-height:1.65;
    }

    .actions{
      position:relative;z-index:5;
      margin-top:34px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:56px;
      padding:14px 26px;
      color:#fff;
      text-decoration:none;
      text-align:center;
      font-size:17px;
      font-weight:800;
      letter-spacing:-.01em;
      border:1px solid rgba(255,255,255,.11);
      border-radius:999px;
      background:
        radial-gradient(circle at 84% 50%,rgba(95,224,238,.15),transparent 31%),
        linear-gradient(180deg,#ef4444,#c91e1e);
      box-shadow:
        0 20px 50px rgba(220,38,38,.28),
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 0 42px rgba(239,68,68,.18);
      transition:transform .18s ease,box-shadow .18s ease;
    }
    .btn:hover{transform:translateY(-2px);box-shadow:0 24px 58px rgba(220,38,38,.34),0 0 0 1px rgba(255,255,255,.08) inset,0 0 48px rgba(239,68,68,.22)}
    .btn:focus-visible{outline:3px solid var(--cyan);outline-offset:5px}
    .btn svg{width:18px;height:18px;fill:currentColor;flex:none}
    .btn-ghost{
      background:rgba(255,255,255,.035);
      border-color:rgba(228,233,241,.22);
      box-shadow:none;
      color:#DDE7F7;
    }
    .btn-ghost:hover{box-shadow:none;border-color:rgba(95,224,238,.52);background:rgba(95,224,238,.10);color:#fff}
    .btn-big{min-height:64px;padding:18px 34px;font-size:19px}
    .hero-note{position:relative;z-index:2;margin:14px 0 0;color:var(--muted);font-size:12px}

    .reassurance{
      position:relative;z-index:5;
      margin-top:18px;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:10px;
    }
    .reassurance span{
      padding:8px 13px;
      border:1px solid rgba(228,233,241,.15);
      border-radius:999px;
      background:rgba(255,255,255,.035);
      color:#DDE7F7;
      font-size:12.5px;
    }

    .steps{
      padding:68px 0;
      border-top:1px solid var(--line);
    }
    .section-heading{max-width:700px;margin:0 auto 32px;text-align:center}
    .section-heading h2,.cta-block h2{
      margin:0;
      font-size:clamp(32px,4.6vw,48px);
      line-height:1.07;
      letter-spacing:-.035em;
    }
    .steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .steps li{
      min-height:215px;
      display:grid;
      grid-template-columns:50px 1fr;
      gap:15px;
      align-items:start;
      padding:24px;
      border:1px solid rgba(95,224,238,.15);
      border-radius:22px;
      background:linear-gradient(180deg,rgba(13,26,53,.82),rgba(9,20,43,.84));
      box-shadow:0 16px 44px rgba(0,0,0,.20);
    }
    .steps li>b{
      width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
      color:var(--teal);border:1px solid rgba(47,191,163,.52);background:#08152D;font-size:12px;letter-spacing:.08em;
    }
    .steps h3{margin:2px 0 9px;font-size:18px;line-height:1.2}
    .steps p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}

    .cta-block{
      position:relative;
      margin:0 0 72px;
      padding:56px 32px;
      text-align:center;
      border:1px solid rgba(95,224,238,.15);
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 0%,rgba(33,72,140,.35),transparent 60%),
        linear-gradient(180deg,rgba(13,26,53,.82),rgba(9,20,43,.84));
      box-shadow:0 16px 44px rgba(0,0,0,.20);
      overflow:hidden;
    }
    .cta-block .eyebrow{margin-bottom:14px}
    .cta-block>p{max-width:600px;margin:16px auto 0;color:#AABAD0;font-size:17px;line-height:1.65}
    .cta-block .actions{margin-top:28px}

    /* Pricing */
    .pricing-hero{padding:64px 0 28px;text-align:center}
    .pricing-hero h1{font-size:clamp(36px,5.4vw,62px)}
    .pricing-hero .lede{max-width:700px}
    .price-card{
      position:relative;
      max-width:720px;
      margin:22px auto 0;
      padding:36px 32px 34px;
      border:1px solid rgba(95,224,238,.28);
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 0%,rgba(33,72,140,.40),transparent 60%),
        linear-gradient(180deg,rgba(13,26,53,.92),rgba(9,20,43,.94));
      box-shadow:0 22px 60px rgba(0,0,0,.28),0 0 0 1px rgba(95,224,238,.06) inset;
      text-align:center;
    }
    .price-card .eyebrow{margin-bottom:12px}
    .price{
      margin:0;
      font-size:clamp(44px,7vw,68px);
      line-height:1;
      letter-spacing:-.045em;
      font-weight:850;
    }
    .price small{
      display:block;
      margin-top:8px;
      font-size:16px;
      font-weight:700;
      letter-spacing:0;
      color:var(--muted);
    }
    .facts{
      list-style:none;
      margin:26px auto 0;
      padding:0;
      max-width:620px;
      display:grid;
      gap:10px;
      text-align:left;
    }
    .facts li{
      display:grid;
      grid-template-columns:22px 1fr;
      gap:12px;
      align-items:start;
      padding:14px 18px;
      border:1px solid rgba(95,224,238,.15);
      border-radius:16px;
      background:rgba(8,21,45,.55);
      color:#DDE7F7;
      font-size:15px;
      line-height:1.5;
    }
    .facts li>i{
      width:22px;height:22px;margin-top:1px;border-radius:50%;display:grid;place-items:center;
      color:var(--teal);border:1px solid rgba(47,191,163,.52);background:#08152D;font-style:normal;
    }
    .facts li>i svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .facts li.floor{border-color:rgba(47,191,163,.40)}
    .price-card .actions{margin-top:30px}
    .alt{margin:16px auto 0;max-width:560px;color:#AABAD0;font-size:14.5px;line-height:1.6}
    .alt a{color:var(--cyan)}

    .card-quiet{
      max-width:720px;
      margin:26px auto 0;
      padding:30px 32px;
      border:1px solid rgba(228,233,241,.13);
      border-radius:24px;
      background:rgba(255,255,255,.028);
      text-align:center;
    }
    .card-quiet h2{margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.15;letter-spacing:-.03em}
    .card-quiet .price-line{margin:12px 0 0;color:#DDE7F7;font-size:17px;font-weight:700;line-height:1.5}
    .card-quiet p{margin:10px auto 0;max-width:560px;color:var(--muted);font-size:15px;line-height:1.6}
    .card-quiet .actions{margin-top:22px}

    .fine-print{
      max-width:720px;
      margin:34px auto 72px;
      color:#7F92AF;
      font-size:12.5px;
      line-height:1.65;
      text-align:center;
    }

    /* Long-form pages (privacy, 404) */
    .page{
      max-width:760px;
      margin:0 auto;
      padding:64px 0 80px;
    }
    .page .eyebrow{justify-content:flex-start}
    .page h1{font-size:clamp(36px,5vw,56px)}
    .page .updated{margin:14px 0 0;color:var(--muted);font-size:13px}
    .page h2{margin:38px 0 10px;font-size:22px;line-height:1.2;letter-spacing:-.02em}
    .page p,.page li{color:#B7C6DD;font-size:16px;line-height:1.65}
    .page p{margin:12px 0 0}
    .page ul{margin:12px 0 0;padding-left:22px}
    .page li{margin:6px 0}
    .page a{color:var(--cyan)}
    .page a.btn{color:#fff}
    .page .box{
      margin:22px 0 0;
      padding:18px 20px;
      border:1px solid rgba(95,224,238,.15);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(13,26,53,.82),rgba(9,20,43,.84));
    }
    .page .box p:first-child{margin-top:0}
    .page .actions{justify-content:flex-start;margin-top:26px}
    .page-center{text-align:center}
    .page-center .eyebrow,.page-center .actions{justify-content:center}
    .page-center .lede{margin-top:18px}

    footer{
      width:min(var(--max),calc(100% - 36px));
      margin:0 auto;
      padding:34px 0 48px;
      border-top:1px solid var(--line);
      color:#7F92AF;
      text-align:center;
      font-size:11.5px;
      line-height:1.6;
    }
    footer p{max-width:900px;margin:8px auto}
    footer a{color:#AFC0DA;text-decoration:none;border-bottom:1px solid rgba(175,192,218,.35)}
    footer a:hover{color:#fff;border-bottom-color:var(--cyan)}
    .footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin:0 0 8px}

    @media(max-width:760px){
      .site-header{min-height:76px}
      .brand{font-size:15px}.brand-mark{width:40px;height:40px}
      .brand-suffix{display:none}
      .header-right{gap:10px;min-width:0}
      .nav-link{display:none}
      .build-state{font-size:9px;padding:6px 8px;white-space:normal;text-align:center;line-height:1.3}
      main{width:min(100% - 24px,var(--max))}
      .hero{min-height:0;padding:58px 0 48px}
      h1{font-size:42px}
      .lede{font-size:16px}
      .actions{flex-direction:column;align-items:stretch}
      .btn{width:100%}
      .btn-big{font-size:17px;padding:16px 22px}
      .steps ol{grid-template-columns:1fr}
      .steps li{min-height:0}
      .cta-block{padding:44px 18px;border-radius:22px}
      .pricing-hero{padding:48px 0 20px}
      .pricing-hero h1{font-size:36px}
      .price-card{padding:28px 18px 26px;border-radius:22px}
      .price{font-size:46px}
      .facts li{font-size:14px;padding:12px 14px}
      .card-quiet{padding:24px 18px;border-radius:20px}
      .fine-print{margin-bottom:56px}
      .page{padding:44px 0 60px}
      .page h1{font-size:36px}
      footer{width:min(100% - 24px,var(--max))}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
  </style>
</head>
