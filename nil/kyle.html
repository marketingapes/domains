<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyle | Nearest Injury Lawyers</title>
  <meta name="description" content="Kyle test page for Nearest Injury Lawyers." />
  <style>
    :root { color-scheme: light; --ink:#09213f; --blue:#1267d6; --soft:#eef6ff; --line:#d4e1f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:var(--soft); }
    main { width:min(760px,calc(100% - 40px)); text-align:center; background:#fff; border:1px solid var(--line); border-radius:24px; padding:56px 36px; box-shadow:0 24px 60px rgba(9,33,63,.12); }
    .badge { display:inline-block; border-radius:999px; padding:8px 12px; background:#dcecff; color:#0857bc; font-weight:800; font-size:.84rem; }
    h1 { font-size:clamp(2.5rem,8vw,5rem); line-height:1; letter-spacing:-.055em; margin:22px 0 16px; }
    p { font-size:1.15rem; line-height:1.6; color:#39516e; margin:0 auto; max-width:560px; }
    strong { color:var(--blue); }
  </style>
</head>
<body>
  <main>
    <span class="badge">Nearest Injury Lawyers</span>
    <h1>Kyle.html is <strong>live.</strong></h1>
    <p>This page was created as a direct test of the NIL GitHub → Render publishing workflow.</p>
  </main>
</body>
</html>
