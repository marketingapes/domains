        setMessages(newMessages);
        setLoading(true);

        const history = [{ role: "user", content: "Begin the intake." }];
        newMessages.forEach((m, i) => {
          if (i === 0) history.push({ role: "assistant", content: m.text });
          else history.push({ role: m.role === "ai" ? "assistant" : "user", content: m.text });
        });

        const reply = await callClaude(history);
        const jsonMatch = reply.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          try {
            const parsed = JSON.parse(jsonMatch[0]);
            setResults(parsed);
            setPhase("results");
            setLoading(false);
            const autoTranscript = newMessages.map((m, i) => ({
              turn: i + 1,
              role: m.role === "ai" ? "assistant" : "user",
              text: m.text,
            }));
            const autoUtms = getUTMs();
            fireWebhook({
              session_id:           SESSION_ID,
              claim_likelihood:     parsed.hasClaimLikelihood || "",
              matched_torts:        parsed.matchedTorts?.map(t => t.name).join(", ") || "",
              matched_torts_detail: JSON.stringify(parsed.matchedTorts || []),
              summary:              parsed.summary || "",
              next_step:            parsed.nextStep || "",
              conversation:         JSON.stringify(autoTranscript),
              utm_source:           autoUtms.utm_source,
              utm_medium:           autoUtms.utm_medium,
              utm_campaign:         autoUtms.utm_campaign,
              utm_content:          autoUtms.utm_content,
              utm_term:             autoUtms.utm_term,
              utm_id:               autoUtms.utm_id,
              clid:                 autoUtms.clid,
              trusturl:             autoUtms.trusturl,
              ipad:                 autoUtms.ipad,
              page_url:             autoUtms.page_url,
              referrer:             autoUtms.referrer,
              timestamp:            autoUtms.timestamp,
            });
            return;
          } catch(e) {}
        }
        setMessages([...newMessages, { role: "ai", text: reply }]);
        setLoading(false);
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const submitLead = async () => {
        if (!leadForm.name || !leadForm.phone || !leadForm.email) return;
        setSubmitting(true);

        const transcript = messages.map((m, i) => ({
          turn: i + 1,
          role: m.role === "ai" ? "assistant" : "user",
          text: m.text,
        }));

        const utms = getUTMs();

        await fireWebhook({
          session_id:           SESSION_ID,
          lead_name:            leadForm.name,
          lead_phone:           leadForm.phone,
          lead_email:           leadForm.email,
          claim_likelihood:     results?.hasClaimLikelihood || "",
          matched_torts:        results?.matchedTorts?.map(t => t.name).join(", ") || "",
          matched_torts_detail: JSON.stringify(results?.matchedTorts || []),
          summary:              results?.summary || "",
          next_step:            results?.nextStep || "",
          conversation:         JSON.stringify(transcript),
          utm_source:           utms.utm_source,
          utm_medium:           utms.utm_medium,
          utm_campaign:         utms.utm_campaign,
          utm_content:          utms.utm_content,
          utm_term:             utms.utm_term,
          utm_id:               utms.utm_id,
          clid:                 utms.clid,
          trusturl:             utms.trusturl,
          ipad:                 utms.ipad,
          page_url:             utms.page_url,
          referrer:             utms.referrer,
          timestamp:            utms.timestamp,
        });

        setSubmitting(false);
        setSubmitted(true);
      };

      const restart = () => {
        setPhase("landing");
        setMessages([]);
        setInput("");
        setResults(null);
        setLikelihoodWidth(0);
        setShowModal(false);
        setSubmitted(false);
        setLeadForm({ name: "", phone: "", email: "" });
      };

      const likelihoodLabel = {
        high:     "Strong Indicators Present",
        moderate: "Possible Claim — Review Recommended",
        low:      "Limited Indicators — Consult An Attorney",
      };

      return (
        <>
          <style>{STYLES}</style>
          <div className="app">
            <div className="bg-texture" />
            <div className="header">
              <div className="logo-dot" />
              <span className="logo-text">DoIHaveAClaim.ai</span>
            </div>
            <div className="main">

              {phase === "landing" && (
                <div className="landing">
                  <div className="landing-eyebrow">Free · Confidential · No Pressure</div>
                  <h1 className="landing-headline">Do you have<br />a<em> legal claim?</em></h1>
                  <button className="start-btn" onClick={startChat}>Find Out Now</button>
                  <p className="disclaimer">
                    Chat with our AI for a few minutes, describe what happened to you, and find out if you actually have a legal claim — and what kind of lawyer handles it. If you want, we'll find the right firm and send you their contact info directly. No one calls you, no one sells your data, and you reach out when you're ready. This tool does not provide legal advice and does not create an attorney-client relationship. Results are informational only.
                  </p>
                </div>
              )}

              {phase === "chat" && (
                <div className="chat-container">
                  <div className="chat-eyebrow">Free Case Evaluation &nbsp;·&nbsp; Confidential</div>
                  <div className="messages">
                    {messages.map((m, i) => (
                      <div key={i} className={`msg ${m.role === "ai" ? "msg-ai" : "msg-user"}`}>
                        {m.role === "ai" ? (
                          <>
                            <div className="msg-ai-icon"><ScaleIcon /></div>
                            <div className="msg-ai-text">{m.text.replace(/\*\*/g, "")}</div>
                          </>
                        ) : (
                          <div className="msg-user-bubble">{m.text}</div>
                        )}
                      </div>
                    ))}
                    {loading && (
                      <div className="typing">
                        <div className="typing-icon"><ScaleIcon /></div>
                        <div className="dots">
                          <div className="dot"/><div className="dot"/><div className="dot"/>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                  <div className="input-area">
                    <textarea
                      className="chat-input"
                      value={input}
                      onChange={e => setInput(e.target.value)}
                      onKeyDown={handleKeyDown}
                      placeholder="Type your answer..."
                      rows={1}
                      disabled={loading}
                    />
                    <button className="send-btn" onClick={sendMessage} disabled={loading || !input.trim()}>
                      <SendIcon />
                    </button>
                  </div>
                </div>
              )}

              {phase === "results" && results && (
                <div className="results">
                  <div className="results-header">
                    <div className="results-label">Evaluation Complete</div>
                    <div className="results-headline">
                      {results.hasClaimLikelihood === "high"
                        ? "You may have a significant claim."
                        : results.hasClaimLikelihood === "moderate"
                        ? "Your situation warrants a review."
                        : "Your situation may have limited options."}
                    </div>
                  </div>

                  <div className="likelihood-bar">
                    <span className="likelihood-label">Claim Likelihood</span>
                    <div className="likelihood-track">
                      <div className="likelihood-fill" style={{ width: `${likelihoodWidth}%` }} />
                    </div>
                    <span className="likelihood-value">
                      {likelihoodLabel[results.hasClaimLikelihood] || results.hasClaimLikelihood}
                    </span>
                  </div>

                  <p className="summary-text">{results.summary}</p>

                  {results.matchedTorts && results.matchedTorts.length > 0 ? (
                    <>
                      <div className="torts-label">Matched Case Types</div>
                      <div className="torts-list">
                        {results.matchedTorts.map((t, i) => (
                          <div key={i} className="tort-card" style={{ animationDelay: `${i * 0.1}s` }}>
                            <div className={`tort-urgency urgency-${t.urgency}`} />
                            <div>
                              <div className="tort-name">{t.name}</div>
                              <div className="tort-desc">{t.description}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </>
                  ) : (
                    <div className="no-match">
                      <div className="no-match-title">No Active Mass Tort Match</div>
                      <div className="no-match-text">Your situation doesn't clearly match our current active tort verticals, but that doesn't mean you don't have a claim. An attorney may still be able to help.</div>
                    </div>
                  )}

                  <div className="cta-box">
                    <div className="cta-text">
                      <div className="cta-next-label">Your Next Step</div>
                      <div className="cta-action">{results.nextStep}</div>
                    </div>
                    <button className="cta-btn" onClick={() => { setShowModal(true); setSubmitted(false); }}>
                      Get The Firm List
                    </button>
                  </div>

                  <button className="restart-btn" onClick={restart}>← Start Over</button>
                </div>
              )}

            </div>
          </div>

          {showModal && (
            <div className="modal-overlay" onClick={e => { if (e.target.className === "modal-overlay") setShowModal(false); }}>
              <div className="modal">
                <button className="modal-close" onClick={() => setShowModal(false)}>×</button>

                {/* Hidden UTM fields — captured in payload, not shown to user */}
                <input type="hidden" id="hf_utm_source"   value={getUTMs().utm_source} />
                <input type="hidden" id="hf_utm_campaign" value={getUTMs().utm_campaign} />
                <input type="hidden" id="hf_utm_medium"   value={getUTMs().utm_medium} />
                <input type="hidden" id="hf_utm_term"     value={getUTMs().utm_term} />
                <input type="hidden" id="hf_utm_content"  value={getUTMs().utm_content} />
                <input type="hidden" id="hf_utm_id"       value={getUTMs().utm_id} />
                <input type="hidden" id="hf_clid"         value={getUTMs().clid} />
                <input type="hidden" id="hf_trusturl"     value={getUTMs().trusturl} />
                <input type="hidden" id="hf_ipad"         value={getUTMs().ipad} />

                {!submitted ? (
                  <>
                    <div className="modal-eyebrow">Your Call. Your Timeline.</div>
                    <div className="modal-headline">Want the contact info for firms that handle cases like yours?</div>
                    <div className="modal-sub">
                      We'll send you a short list. No one calls you. No one gets your info. You reach out if and when you feel like it.
                    </div>

                    <div className="modal-field">
                      <label className="modal-label">Full Name</label>
                      <input className="modal-input" type="text" placeholder="Your full name"
                        value={leadForm.name} onChange={e => setLeadForm(f => ({ ...f, name: e.target.value }))} />
                    </div>
                    <div className="modal-field">
                      <label className="modal-label">Phone Number</label>
                      <input className="modal-input" type="tel" placeholder="(555) 000-0000"
                        value={leadForm.phone} onChange={e => setLeadForm(f => ({ ...f, phone: e.target.value }))} />
                    </div>
                    <div className="modal-field">
                      <label className="modal-label">Email Address</label>
                      <input className="modal-input" type="email" placeholder="you@email.com"
                        value={leadForm.email} onChange={e => setLeadForm(f => ({ ...f, email: e.target.value }))} />
                    </div>

                    <button className="modal-submit" onClick={submitLead}
                      disabled={submitting || !leadForm.name || !leadForm.phone || !leadForm.email}>
                      {submitting ? (
                        <><div className="dots" style={{paddingTop:0}}><div className="dot"/><div className="dot"/><div className="dot"/></div> Sending...</>
                      ) : "Yeah, Send Me The List →"}
                    </button>

                    <div className="modal-disclaimer">
                      Your information is never shared with anyone.
                    </div>
                  </>
                ) : (
                  <div className="modal-success">
                    <div className="success-icon"><CheckIcon /></div>
                    <div className="success-headline">Check your email.</div>
                    <div className="success-sub">
                      It's a short list of firms that handle exactly your type of claim. Reach out when you're ready — or don't. Up to you.
                    </div>
                    {results?.matchedTorts?.[0] && (
                      <div className="success-tort">
                        <strong>Matched claim type:</strong> {results.matchedTorts[0].name}<br />
                        {results.matchedTorts[0].description}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
