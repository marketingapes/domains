<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tossed Brew</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 2rem; background: #faf5f0; color: #2b1d12;
      font: 1.125rem/1.6 system-ui, sans-serif; }
    main { width: min(100%, 44rem); padding: clamp(1.5rem, 5vw, 3rem);
      border-top: .4rem solid #c4733a; background: #fff;
      border-radius: .25rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.12;
      margin: 0 0 1.5rem; overflow-wrap: anywhere; }
    p { margin: 0 0 1rem; }
    .domain { font-size: .9rem; overflow-wrap: anywhere; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Tossed Brew</h1>
    <p>Our website is being prepared.</p>
    <p>Please check back for updates.</p>
    <p class="domain">tossedbrew.com</p>
  </main>
</body>
</html>
