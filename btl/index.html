<style>
  /* QUIET AUTHORITY — Kyle's brand sheet, 2026-09-27
     Ink #0E1726 ground · Paper #F5F0E8 calm · Brass #B8893A brand (big type + key accents)
     Sofia Blue #2F6BFF actions/interactive only · Stone #5B6472 body on light */
  :root{
    --ink-ground:#0E1726;
    --paper:#F5F0E8; --stone:#5B6472;
    --brass:#B8893A; --brass-light:#D9B25F; --brass-deep:#8A6A24;
    --blue:#2F6BFF;
    --bg:#0E1726; --surface:#152336;
    --ink:#F5F0E8; --muted:#AEB4BE; --faint:#707786;
    --line:rgba(245,240,232,.10);
    --call:#2FD574;
    --ease:cubic-bezier(.22,1,.36,1);
    --grotesk:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    --serif:"Fraunces",Georgia,Didot,"Bodoni MT","Times New Roman",serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--grotesk);
    font-weight:500; font-size:16px; line-height:1.6; letter-spacing:.015em;
    overflow:hidden; overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  /* CINEMATIC BACKGROUND — Quiet Authority art. Hits on first frame. */
  .bg{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:var(--ink-ground) url('assets/bg-quiet-authority.jpg') center 38% / cover no-repeat;
    animation:bgIn 2.4s var(--ease) both;}
  @keyframes bgIn{from{opacity:0; transform:scale(1.05);} to{opacity:1; transform:scale(1);}}
  /* the page deepens as the conversation progresses — one overlay per stage, body[data-step] */
  .deepen{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:var(--ink-ground); opacity:0; transition:opacity 1.2s var(--ease);}
  body[data-step="1"] .deepen{opacity:.30;}
  body[data-step="2"] .deepen{opacity:.50;}
  body[data-step="3"] .deepen{opacity:.68;}
  /* legibility shade — constant, text always readable over the art */
  .shade{position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(14,23,38,.52), rgba(14,23,38,.66) 55%, rgba(14,23,38,.86));}

  .stage{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column;
    max-width:520px; margin:0 auto; padding:0 0 env(safe-area-inset-bottom);}

  /* top bar */
  .topbar{display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 4px;}
  .lockup{display:flex; align-items:center; gap:10px;}
  .lockup svg{width:26px; height:26px; display:block;}
  .lockup .name{font-weight:600; font-size:.95rem; letter-spacing:.02em;}
  .staged{font-family:var(--mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--line); border-radius:99px;
    padding:5px 10px; background:rgba(14,23,38,.35);}

  /* sofia presence — the orb is the interface, brass now */
  .presence{display:flex; flex-direction:column; align-items:center;
    padding:10px 0 0; gap:10px;
    animation:arrive 1.15s var(--ease) .25s both;}
  @keyframes arrive{from{opacity:0; transform:translateY(20px) scale(.95);}
    to{opacity:1; transform:none;}}
  .orb{position:relative; width:124px; height:124px;}
  .orb .core{position:absolute; inset:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 58%, var(--brass-deep));
    box-shadow:0 0 30px rgba(184,137,58,.45), 0 0 80px rgba(184,137,58,.18);
    animation:breathe 4s var(--ease) infinite;}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .orb .halo{position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(184,137,58,.35); animation:ring 4s var(--ease) infinite;}
  @keyframes ring{0%{transform:scale(.6); opacity:0}35%{opacity:.7}100%{transform:scale(1.04); opacity:0}}
  /* states */
  .orb.is-listening .core{animation-duration:1.1s;}
  .orb.is-speaking .core{animation:surge 1s var(--ease) infinite;}
  @keyframes surge{0%,100%{transform:scale(1.04)}50%{transform:scale(1.14)}}
  .who{font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint);
    min-height:1.2em; transition:color .3s;}
  .who.live{color:var(--brass-light);}

  /* progress — a brass line, not dots */
  .progress{display:flex; gap:6px; justify-content:center; padding:8px 0 0; width:120px; margin:0 auto;}
  .progress i{flex:1; height:2px; border-radius:2px; background:rgba(245,240,232,.14);
    transition:background .4s var(--ease), box-shadow .4s var(--ease);}
  .progress i.on{background:var(--brass-light); box-shadow:0 0 8px rgba(217,178,95,.7);}

  /* chat */
  .chat{flex:1; overflow-y:auto; padding:14px 20px 8px; display:flex;
    flex-direction:column; gap:14px; scrollbar-width:none;}
  .chat::-webkit-scrollbar{display:none;}
  .msg{max-width:88%; line-height:1.5; font-size:1.28rem; font-weight:500; letter-spacing:.01em;
    opacity:0; animation:enter .45s var(--ease) forwards;}
  @keyframes enter{from{opacity:0; transform:translateY(14px); filter:blur(6px);}
    to{opacity:1; transform:none; filter:blur(0);}}
  .msg.sofia{align-self:flex-start; background:rgba(21,35,54,.72);
    border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:15px 17px;
    backdrop-filter:blur(2px);}
  .msg.sofia .serifline{font-family:var(--serif); font-size:2rem; line-height:1.25; letter-spacing:0; font-weight:400;}
  .msg.user{align-self:flex-end; background:var(--blue); color:#fff;
    border-radius:14px 14px 4px 14px; padding:12px 16px; font-size:1rem;}
  .msg.sys{align-self:center; font-size:.72rem; color:var(--faint); letter-spacing:.06em;
    border:1px dashed var(--line); border-radius:99px; padding:7px 14px; max-width:100%;}
  /* verdict — the paper card. Quiet Authority, on the page like a letter. */
  .msg.verdict{align-self:stretch; max-width:100%; background:var(--paper);
    border:1px solid rgba(14,23,38,.12); border-top:2px solid var(--brass);
    border-radius:6px; padding:28px 24px; text-align:center; color:var(--ink-ground);}
  .msg.verdict h3{font-family:var(--serif); font-weight:400; margin:0 0 12px;
    font-size:2.1rem; line-height:1.15; letter-spacing:-0.01em; color:var(--ink-ground);}
  .msg.verdict p{margin:0 0 22px; color:var(--stone); font-size:.98rem; font-weight:400;}
  .msg.verdict p b{color:var(--ink-ground); font-weight:600;}

  /* chips — lanes BTL owns; blue is for actions only */
  .chips{display:flex; flex-wrap:wrap; gap:9px; padding:6px 20px 0;}
  .chips-label{width:100%; font-size:.66rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--faint); padding:2px 2px 0;}
  .chip{border:1px solid rgba(245,240,232,.16); background:rgba(14,23,38,.35);
    color:var(--ink); border-radius:999px; padding:11px 18px; font-size:.92rem; font-weight:500;
    font-family:var(--grotesk); letter-spacing:.02em; cursor:pointer;
    opacity:0; animation:enter .4s var(--ease) forwards;
    transition:border-color .2s var(--ease), background .2s var(--ease);}
  .chip:active{background:rgba(47,107,255,.28); border-color:var(--blue);}

  /* input — the composer; free-text-first */
  .inputbar{display:flex; gap:10px; padding:12px 16px 12px; align-items:center;}
  .composer{flex:1; display:flex; align-items:center; background:rgba(14,23,38,.45);
    border:1px solid var(--line); border-radius:999px; padding:4px 4px 4px 18px;
    transition:border-color .25s var(--ease);}
  .composer:focus-within{border-color:rgba(47,107,255,.6);}
  .composer input{flex:1; background:none; border:none; color:var(--ink);
    font-size:.95rem; font-weight:500; font-family:var(--grotesk); outline:none; min-width:0;}
  .composer input::placeholder{color:var(--faint); font-weight:400;}
  .iconbtn{width:44px; height:44px; flex:none; border-radius:50%; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);}
  .iconbtn:active{transform:scale(.93);}
  .iconbtn svg{width:19px; height:19px;}
  #micBtn.listening{border-color:var(--blue); color:var(--blue);}
  #sendBtn{background:var(--blue); border:none; color:#fff;
    opacity:0; transform:scale(.6); pointer-events:none;}
  #sendBtn.ready{opacity:1; transform:scale(1); pointer-events:auto;}

  .callbtn{display:inline-flex; align-items:center; gap:10px; background:var(--call);
    color:#04120a; font-weight:700; font-size:1.05rem; letter-spacing:.01em;
    border:none; border-radius:999px; padding:16px 36px; text-decoration:none; cursor:pointer;
    box-shadow:0 6px 28px rgba(47,213,116,.35);
    transition:opacity .2s var(--ease), transform .2s var(--ease);}
  .callbtn:active{transform:scale(.97); opacity:.92;}
  .callbtn svg{width:18px; height:18px;}
  .ghostnum{display:inline-block; margin-top:14px; color:var(--blue);
    font-size:.9rem; font-weight:600; text-decoration:none; letter-spacing:.03em;}

  .whisper{text-align:center; font-size:.66rem; font-weight:400; color:var(--faint);
    padding:6px 34px 4px; line-height:1.5; letter-spacing:.03em;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;}
    .msg,.chip{opacity:1;}
    .bg{opacity:1; transform:none;}
  }
</style>
</head>
<body data-step="0">
<div class="bg" aria-hidden="true"></div>
<div class="deepen" aria-hidden="true"></div>

<div class="stage">
  <div class="topbar">
    <div class="lockup">
      <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="btlg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3B8BF0"/><stop offset="1" stop-color="#1B59C3"/>
        </linearGradient></defs>
        <path d="M50 5 L85 18 V50 C85 74 68 88 50 95 C32 88 15 74 15 50 V18 Z" fill="url(#btlg)"/>
        <polygon points="50,26 68,52 59,52 59,80 41,80 41,52 32,52" fill="#fff"/>
      </svg>
      <span class="name">Best Tort Lawyers</span>
    </div>
    <span class="staged">prototype · staged data</span>
  </div>

  <div class="presence">
    <div class="orb" id="orb"><span class="halo"></span><span class="core"></span></div>
    <div class="who" id="who">Sofia · AI intake</div>
  </div>

  <div class="progress" id="progress"><i></i><i></i><i></i></div>

  <div class="chat" id="chat"></div>
  <div class="chips" id="chips" style="display:none"></div>

  <div class="inputbar">
    <div class="composer">
      <input id="textIn" type="text" placeholder="Say it in your own words…" autocomplete="off" enterkeyhint="send" aria-label="Message Sofia">
      <button class="iconbtn" id="micBtn" aria-label="Talk to Sofia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
      </button>
      <button class="iconbtn" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="whisper">Not a law firm · Attorney advertising · Sofia is an automated assistant</div>
</div>

<script>
(function(){
  "use strict";
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var chat = document.getElementById('chat'),
      chipsEl = document.getElementById('chips'),
      textIn = document.getElementById('textIn'),
      sendBtn = document.getElementById('sendBtn'),
      micBtn = document.getElementById('micBtn'),
      orb = document.getElementById('orb'),
      who = document.getElementById('who'),
      prog = document.getElementById('progress').children;

  var answers = {};

  /* ---------- orb states: idle / listening / speaking ---------- */
  function setOrb(state, label){
    orb.classList.remove('is-listening','is-speaking');
    if(state==='listening') orb.classList.add('is-listening');
    else if(state==='speaking') orb.classList.add('is-speaking');
    who.textContent = label || 'Sofia · AI intake';
    who.classList.toggle('live', state!=='idle');
  }

  /* ---------- helpers ---------- */
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstChild; }
  function scroll(){ chat.scrollTop = chat.scrollHeight; }
  function say(html, cls){
    var m = el('<div class="msg '+(cls||'sofia')+'">'+html+'</div>');
    chat.appendChild(m); scroll(); return m;
  }
  function typing(cb, ms){
    setOrb('speaking','Sofia · speaking');
    var t = el('<div class="msg sofia"><span style="letter-spacing:.35em; color:var(--muted)">···</span></div>');
    chat.appendChild(t); scroll();
    setTimeout(function(){ t.remove(); setOrb('idle'); cb(); }, reduced ? 60 : (ms||900));
  }
  function ask(lines, opts){
    opts = opts||{};
    var i=0;
    (function next(){
      if(i>=lines.length){
        if(opts.chips) showChips(opts.chips, opts.chipsLabel);
        if(opts.done) opts.done();
        return;
      }
      typing(function(){ say(lines[i++]); setTimeout(next, reduced ? 60 : 480); }, 700+Math.random()*450);
    })();
  }
  function showChips(list, label){
    chipsEl.innerHTML='';
    if(label){
      var l=document.createElement('div'); l.className='chips-label'; l.textContent=label;
      chipsEl.appendChild(l);
    }
    chipsEl.style.display='flex';
    list.forEach(function(c){
      var b=document.createElement('button'); b.className='chip'; b.textContent=c.label;
      b.onclick=function(){ choose(c); }; chipsEl.appendChild(b);
    });
    scroll();
  }
  function hideChips(){ chipsEl.style.display='none'; chipsEl.innerHTML=''; }
  function choose(c){
    hideChips();
    say(c.label,'user');
    setTimeout(function(){ c.go(); }, reduced ? 60 : 520);
  }
  function setProgress(n){
    for(var i=0;i<prog.length;i++) prog[i].className = i<n ? 'on' : '';
    /* the background deepens with the journey */
    document.body.setAttribute('data-step', String(n));
  }

  /* ---------- conversation — Quiet Authority voice ----------
     Plain, never pushy. One question at a time. Private by default.
     No promises: "may be a claim," never "you have a case."
     The person drives. They choose if a firm calls. */
  var TORTS={
    abuse:{label:'Abuse & institutional', name:'abuse'},
    mass:{label:'Mass tort', name:'mass tort'},
    drug:{label:'Drug & device', name:'drug or device injury'},
    toxic:{label:'Toxic exposure', name:'toxic exposure'},
    mva:{label:'MVA / PI → NIL', name:'vehicle injury'}
  };
  function laneChips(){
    return Object.keys(TORTS).map(function(k){ return {label:TORTS[k].label, go:(function(key){return function(){qWhen(key);};})(k)}; });
  }

  function start(){
    setProgress(0);
    ask([
      '<span class="serifline">I\'m Sofia.</span>',
      'I help people find out if this may be a claim — and the kind of firm that handles it. You can keep this general.',
      'Say it in your own words.'
    ],{chips:laneChips(), chipsLabel:'or choose a lane'});
  }

  function qWhen(key){
    answers.tort=key; setProgress(1);
    ask(['When did this happen? Roughly is fine.'],{chips:[
      {label:'This year', go:function(){qState('recent');}},
      {label:'1–3 years ago', go:function(){qState('mid');}},
      {label:'Longer ago', go:function(){qState('old');}}
    ]});
  }

  function qState(when){
    answers.when=when; setProgress(2);
    ask(['And which state?'],{chips:[
      {label:'California', go:function(){verdict('California');}},
      {label:'Arizona', go:function(){verdict('Arizona');}},
      {label:'Texas', go:function(){verdict('Texas');}},
      {label:'Another state', go:function(){ freeState(); }}
    ]});
  }

  function freeState(){
    hideChips();
    say('Type it below — I\'ll take it from there.');
    textIn.focus();
    pendingState=true;
  }
  var pendingState=false;

  var PHONE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/></svg>';

  function verdict(state){
    answers.state=state; setProgress(3); hideChips();
    var tname=TORTS[answers.tort].name;
    var extra = answers.tort==='mva'
      ? ' That\'s the injury team\'s lane — they\'re built for this.'
      : '';
    typing(function(){
      var v=el('<div class="msg verdict"><h3>Here\'s where you stand.</h3>'+
        '<p>What you described may be a <b>'+tname+'</b> claim.'+extra+
        ' The next step is a short call with an intake team — <b>you decide</b> if a firm calls you back.</p>'+
        '<a class="callbtn" href="tel:+12029329700">'+PHONE_SVG+' Call now</a><br>'+
        '<a class="ghostnum" href="tel:+12029329700">(202) 932-9700 · free, confidential</a></div>');
      chat.appendChild(v); scroll();
      setTimeout(function(){
        say('One call, about five minutes. No forms, no waiting rooms.');
      }, reduced ? 60 : 950);
    }, reduced ? 60 : 1250);
    postLead({tort:answers.tort, when:answers.when, state:answers.state});
  }

  /* ---------- free text — first-class, keyword-routed ---------- */
  function route(text){
    var s=text.toLowerCase();
    if(pendingState){ pendingState=false; verdict(text.trim()||'your state'); return; }
    if(!answers.tort){
      if(/abus|assault|molest|church|school|scout|priest|coach/.test(s)) return qWhen('abuse');
      if(/toxic|expos|roundup|paraquat|talc|pfas|pesticide|chemical|asbestos|lead/.test(s)) return qWhen('toxic');
      if(/drug|pill|device|mesh|implant|recall|ozempic|zantac/.test(s)) return qWhen('drug');
      if(/car|auto|vehicle|crash|accident|truck|moto|uber|lyft|pedestrian/.test(s)) return qWhen('mva');
      if(/mass|tort|class/.test(s)) return qWhen('mass');
      hideChips();
      typing(function(){
        say('Tell me a little more — or choose a lane below.');
        showChips(laneChips(), 'lanes BTL owns');
      },800);
      return;
    }
    if(!answers.when){
      hideChips();
      typing(function(){
        say('Noted. <b>When</b> did it happen? Roughly is fine.');
        showChips([
          {label:'This year', go:function(){qState('recent');}},
          {label:'1–3 years ago', go:function(){qState('mid');}},
          {label:'Longer ago', go:function(){qState('old');}}
        ]);
      },800);
      return;
    }
    if(!answers.state){ pendingState=true; verdict(text.trim()); return; }
    typing(function(){ say('I have what I need — the call button above is the fastest way through.'); },700);
  }

  function send(){
    var v=textIn.value.trim(); if(!v) return;
    textIn.value=''; sendBtn.classList.remove('ready');
    say(v,'user'); setTimeout(function(){ route(v); }, reduced ? 60 : 450);
  }
  sendBtn.onclick=send;
  textIn.addEventListener('input',function(){
    sendBtn.classList.toggle('ready', textIn.value.trim().length>0);
  });
  textIn.addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });

  /* ---------- lead delivery (go-live wired, staged-safe) ---------- */
  /* lead_destination resolves: brand.json override > EE_CONFIG (live Make webhook).
     POST is fire-and-forget: it never blocks or breaks the chat UX. */
  var __leadDest = null;
  function resolveLeadDest(cb){
    if(__leadDest !== null) return cb(__leadDest);
    fetch('./brand.json', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(b){
        __leadDest = (b && b.lead_destination) ||
          (window.EE_CONFIG && window.EE_CONFIG.lead_destination) || '';
        cb(__leadDest);
      }).catch(function(){
        __leadDest = (window.EE_CONFIG && window.EE_CONFIG.lead_destination) || '';
        cb(__leadDest);
      });
  }
  function postLead(a){
    var payload = {
      campaign_id: (window.EE_CONFIG && window.EE_CONFIG.campaign_id) || 'btl-sofia-chat',
      tort: a.tort, when: a.when, state: a.state,
      source: 'btl-sofia-chat', page_path: location.pathname,
      submitted_at: new Date().toISOString()
    };
    try{
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({event:'ee_lead_submit', lead: payload});
      window.dataLayer.push({event:'ee_lead_submit_chat', lead: payload});
      if(window.fbq) fbq('track','Lead');
      if(window.ttq) ttq.track('SubmitForm');
    }catch(e){}
    resolveLeadDest(function(dest){
      if(!dest) return;
      try{
        var body = JSON.stringify(payload);
        if(navigator.sendBeacon){
          var blob = new Blob([body], {type:'application/json'});
          if(navigator.sendBeacon(dest, blob)) return;
        }
        fetch(dest, {method:'POST', headers:{'Content-Type':'application/json'},
          body: body, keepalive:true, mode:'no-cors'}).catch(function(){});
      }catch(e){}
    });
  }

  /* ---------- voice: in-place listening state (Vapi wires at go-live) ---------- */
  /* VAPI GO-LIVE HOOK (Kyle-gated): brand.json → assistant.vapi_assistant_id is
     currently null, so voice stays staged. When Kyle approves the BTL Sofia Vapi
     draft, set assistant.vapi_assistant_id in brand.json and initialize the Vapi
     voice SDK HERE — stream the transcript into chat via say()/route(). */
  var __vapiAssistantId = null;
  fetch('./brand.json', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(b){ __vapiAssistantId = b && b.assistant && b.assistant.vapi_assistant_id || null; })
    .catch(function(){});
  var listening=false, listenTimer=null;
  micBtn.onclick=function(){
    if(listening) return;
    listening=true;
    micBtn.classList.add('listening');
    setOrb('listening','Sofia · listening');
    listenTimer=setTimeout(function(){
      listening=false;
      micBtn.classList.remove('listening');
      setOrb('idle');
      say(__vapiAssistantId ? 'Connecting voice…' : 'Voice connects at go-live — the Vapi hook is staged and ready.','sys');
    }, reduced ? 400 : 2600);
  };
  /* HOOK: wire Vapi voice SDK here — assistant id from brand.json → assistant.voice.
     Voice stays in the composer: no separate mode, transcript streams into chat. */

  start();
})();
</script>
