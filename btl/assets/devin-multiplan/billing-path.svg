<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">From billed charges to payment received</title><desc id="desc">An educational diagram separating billed charges, allowed amount and payment received. No financial figures or outcomes are shown.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#ecebdf"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#26443a" flood-opacity=".1"/></filter></defs><rect width="1000" height="760" fill="#e6ebe1"/><path d="M0 594 1000 277v483H0Z" fill="#dbe3d5"/><circle cx="915" cy="91" r="180" fill="none" stroke="#c9d6c5"/><circle cx="915" cy="91" r="220" fill="none" stroke="#c9d6c5"/><text x="75" y="86" font-family="Arial,sans-serif" font-size="15" letter-spacing="3" fill="#5e776b">FOLLOW THE PAYMENT PICTURE</text><text x="75" y="145" font-family="Georgia,serif" font-size="43" fill="#214b48">Different numbers. Different questions.</text>
<g filter="url(#shadow)"><rect x="74" y="220" width="253" height="325" rx="7" fill="url(#paper)"/><rect x="374" y="220" width="253" height="325" rx="7" fill="url(#paper)"/><rect x="674" y="220" width="253" height="325" rx="7" fill="url(#paper)"/></g>
