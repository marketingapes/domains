<g font-family="Georgia,serif" font-size="28" fill="#214b48"><text x="102" y="422">Billed charges</text><text x="402" y="422">Allowed amount</text><text x="701" y="422">Payment received</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#65796e"><text x="103" y="461">What was billed</text><text x="403" y="461">What was identified</text><text x="403" y="485">as allowable</text><text x="703" y="461">What was paid</text></g><g fill="none" stroke="#7c9788" stroke-width="3"><path d="M337 382h25m-7-7 7 7-7 7M637 382h25m-7-7 7 7-7 7"/></g><path d="M75 607h850" stroke="#bdcbb9"/><text x="75" y="652" font-family="Georgia,serif" font-size="26" fill="#214b48">A difference is a question to review.</text><text x="75" y="688" font-family="Arial,sans-serif" font-size="17" fill="#65796e">It is not, by itself, proof of an improper payment or a claim.</text></svg>
