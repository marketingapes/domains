<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Law-Di-Gras — Bored? Play Snake.</title>
<meta name="description" content="Bored at Law-Di-Gras? Play Snake.">
<link rel="canonical" href="https://kylegosselin.com/rizeup/">
<style>
:root{--navy:#0A2233;--navy2:#0B2A3A;--lime:#3ED600;--ink:#0A2233;--mut:#5c6b75}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;color:#fff;background:var(--navy);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 28px}
/* their hero, full branding */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;background:url('mountain.jpg') center 30%/cover no-repeat,var(--navy)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,34,51,.62) 0%,rgba(10,34,51,.35) 40%,rgba(10,34,51,.88) 100%)}
.topbar{position:relative;z-index:1;padding:28px 0 10px;text-align:center}
.wordmark{text-decoration:none;line-height:1;display:inline-block;text-align:center}
.wordmark .r{font-weight:900;font-size:32px;color:#fff;letter-spacing:-.02em}
.wordmark .u{font-weight:900;font-size:32px;color:var(--lime);letter-spacing:-.02em;position:relative}
.wordmark .u svg{position:absolute;left:2px;top:-8px;width:18px;height:18px}
.wordmark small{display:block;font-size:10px;letter-spacing:.5em;color:#fff;font-weight:700;margin-top:6px;padding-left:.5em}
.herobody{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 0 30px;text-align:center}
.herobody h1{font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:-.03em;line-height:1.05;margin-bottom:24px;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.herobody h1 .g{color:var(--lime)}
/* snake squeezed to screen */
.sgbar{display:flex;justify-content:space-between;align-items:center;margin:0 auto 16px;max-width:560px;font-weight:800;letter-spacing:.12em;font-size:13px;color:#fff}
.sgbar b{color:var(--lime);font-size:20px;margin-left:6px}
#sg{display:block;margin:0 auto;border:3px solid var(--lime);border-radius:18px;background:rgba(10,34,51,.92);box-shadow:0 18px 50px rgba(62,214,0,.25);touch-action:none}
.sgmsg{margin-top:18px;color:#fff;font-weight:700;font-size:15px;min-height:22px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.sgbtn{margin-top:8px;background:var(--lime);color:#fff;border:none;font-weight:800;font-size:17px;padding:14px 44px;border-radius:12px;cursor:pointer;box-shadow:0 10px 26px rgba(62,214,0,.35)}
.sgbtn:active{transform:scale(.97)}
/* contact */
.contact{background:var(--navy2);padding:38px 0 70px;text-align:center;border-top:1px solid rgba(62,214,0,.25)}
.contact h2{font-size:24px;font-weight:900;margin-bottom:14px}
.contact h2 .g{color:var(--lime)}
.contact a{color:var(--lime);font-weight:800;text-decoration:none;font-size:18px}
.contact .row{margin:8px 0;font-size:16px;color:#cfe0e8}
.contact .nums{margin-top:14px;font-size:14px;color:#8fa3ad}
.contact .fine{font-size:12px;color:#5c6b75;margin-top:18px}
</style>
</head>
<body>

<div class="hero">
  <div class="topbar"><div class="wrap">
    <a class="wordmark" href="https://kylegosselin.com/rizeup/" aria-label="Law-Di-Gras boredom relief">
      <span class="r">Law-Di-</span><span class="u">Gras<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21V4M12 4L5 11M12 4l7 7" stroke="#3ED600" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <small>BOREDOM RELIEF</small>
    </a>
  </div></div>
  <div class="herobody"><div class="wrap">
    <h1>Bored? <span class="g">Play Snake.</span></h1>
    <div class="sgbar"><span>SCORE<b id="sgScore">0</b></span><span>BEST<b id="sgBest">0</b></span></div>
    <canvas id="sg"></canvas>
    <div class="sgmsg" id="sgMsg">Tap Play, then swipe to steer.</div>
    <div><button class="sgbtn" id="sgBtn">Play</button></div>
  </div></div>
</div>

<div class="contact"><div class="wrap">
  <h2>Kyle <span class="g">Gosselin</span></h2>
  <div class="row">Text <a href="sms:+16197360356">619-736-0356</a></div>
  <div class="row"><a href="mailto:kyleg@marketingapes.com">kyleg@marketingapes.com</a></div>
  <div class="nums">$19.91 cost per lead · $74.12 cost per signed — LA County, tracked.</div>
  <p class="fine">One gorilla, all AI.</p>
</div></div>

<script>
(function(){
var canvas=document.getElementById('sg'),ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('sgScore'),bestEl=document.getElementById('sgBest');
var msgEl=document.getElementById('sgMsg'),btn=document.getElementById('sgBtn');
var GRID=20,cell=20,snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food={x:5,y:5};
var score=0,loop=null,alive=false;
var best=parseInt(localStorage.getItem('ldg-snake-best')||'0',10)||0;
bestEl.textContent=best;
function size(){
  var maxW=Math.min(canvas.parentElement.clientWidth,560);
  var maxH=Math.floor(window.innerHeight*0.52);
  var w=Math.max(250,Math.min(maxW,maxH));
  var dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=w+'px';canvas.style.height=w+'px';
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);cell=w/GRID;
  if(alive)draw();
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};score=0;scoreEl.textContent='0';
  placeFood();alive=true;
}
function placeFood(){
  for(var i=0;i<400;i++){
    var f={x:(Math.random()*GRID)|0,y:(Math.random()*GRID)|0},ok=true;
    for(var j=0;j<snake.length;j++){if(snake[j].x===f.x&&snake[j].y===f.y){ok=false;break;}}
    if(ok){food=f;return;}
  }
}
function step(){
  dir=nextDir;
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  var hitWall=h.x<0||h.y<0||h.x>=GRID||h.y>=GRID,hitSelf=false;
  for(var i=0;i<snake.length-1;i++){if(snake[i].x===h.x&&snake[i].y===h.y){hitSelf=true;break;}}
  if(hitWall||hitSelf){die();return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score++;scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('ldg-snake-best',String(best));}catch(e){}}
    placeFood();
  }else{snake.pop();}
  draw();
}
function draw(){
  var w=canvas.clientWidth;
  ctx.fillStyle='rgba(10,34,51,.94)';ctx.fillRect(0,0,w,w);
  ctx.strokeStyle='rgba(62,214,0,.14)';ctx.lineWidth=1;
  ctx.beginPath();
  for(var g=1;g<GRID;g++){ctx.moveTo(g*cell,0);ctx.lineTo(g*cell,w);ctx.moveTo(0,g*cell);ctx.lineTo(w,g*cell);}
  ctx.stroke();
  ctx.fillStyle='#3ED600';
  var fp=cell*0.22;
  ctx.fillRect(food.x*cell+fp,food.y*cell+fp,cell-fp*2,cell-fp*2);
  for(var i=snake.length-1;i>=0;i--){
    var s=snake[i],p=cell*0.1;
    ctx.fillStyle=i===0?'#b6ff7a':'#3ED600';
    ctx.fillRect(s.x*cell+p,s.y*cell+p,cell-p*2,cell-p*2);
  }
}
function die(){
  alive=false;clearInterval(loop);loop=null;
  msgEl.textContent='Game over — '+score+' points. Tap Play to go again.';
  btn.textContent='Play again';btn.style.display='inline-block';
}
function start(){
  size();reset();
  msgEl.textContent='Swipe to steer. Eat the green squares.';
  btn.style.display='none';
  clearInterval(loop);
  loop=setInterval(step,120);
  draw();
}
function steer(x,y){
  var nd=null;
  if(x===1&&dir.x!==-1)nd={x:1,y:0};
  else if(x===-1&&dir.x!==1)nd={x:-1,y:0};
  else if(y===1&&dir.y!==-1)nd={x:0,y:1};
  else if(y===-1&&dir.y!==1)nd={x:0,y:-1};
  if(nd)nextDir=nd;
}
btn.addEventListener('click',function(){start();});
canvas.addEventListener('click',function(){if(!alive)start();});
document.addEventListener('keydown',function(e){
  if(!alive)return;
  if(e.key==='ArrowUp'||e.key==='w')steer(0,-1);
  else if(e.key==='ArrowDown'||e.key==='s')steer(0,1);
  else if(e.key==='ArrowLeft'||e.key==='a')steer(-1,0);
  else if(e.key==='ArrowRight'||e.key==='d')steer(1,0);
  else return;
  e.preventDefault();
});
var tx=0,ty=0,touching=false;
canvas.addEventListener('touchstart',function(e){
  var t=e.touches[0];tx=t.clientX;ty=t.clientY;touching=true;
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',function(e){
  if(!touching)return;
  var t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<22&&Math.abs(dy)<22)return;
  if(Math.abs(dx)>Math.abs(dy))steer(dx>0?1:-1,0);else steer(0,dy>0?1:-1);
  tx=t.clientX;ty=t.clientY;
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',function(){touching=false;});
window.addEventListener('resize',function(){size();});
window.addEventListener('orientationchange',function(){setTimeout(size,200);});
size();draw();
})();
</script>
</body>
</html>
