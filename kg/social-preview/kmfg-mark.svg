<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
<title id="title">Kyle Gosselin — embedded KMFG monogram</title>
<desc id="desc">A crisp white KG embedded across oversized blue MF letterforms, on a deep sapphire rounded square.</desc>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1264e8"/><stop offset="1" stop-color="#082969"/></linearGradient>
<linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5fb5ff"/><stop offset="1" stop-color="#2474dd"/></linearGradient>
<linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d5ecff"/></linearGradient>
<path id="kg" d="M44 64V128M79 64L46 96L80 128M148 72C141 62 128 59 117 65C106 71 103 82 103 96C103 116 113 129 130 129C140 129 148 124 152 118V98H133"/>
</defs>
<rect width="192" height="192" rx="42" fill="url(#base)"/>
<rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
<!-- Oversized MF is the structure behind the foreground monogram. -->
<g fill="none" stroke="url(#back)" stroke-width="15" stroke-linejoin="miter" stroke-linecap="square">
<path d="M26 152V38L59 74L92 38V152"/>
<path d="M120 152V38H164M120 83H156"/>
</g>
<!-- A sapphire inset separates the white face from the structural letters. -->
<use href="#kg" fill="none" stroke="#092f7d" stroke-opacity=".7" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 3)"/>
<use href="#kg" fill="none" stroke="url(#face)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
